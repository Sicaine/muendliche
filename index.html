<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayerische Jägerprüfung – Mündliche Prüfung</title>
<style>
:root {
  --forest: #1e3a0f;
  --leaf: #3a6b22;
  --leaf-light: #4e8c30;
  --bark: #7a5c1e;
  --moss: #c8d96f;
  --paper: #faf8f2;
  --card: #ffffff;
  --ink: #1e1a0f;
  --muted: #6b6050;
  --ai-color: #1a5f7a;
  --ai-bg: #eaf5fa;
  --border: #ddd5c0;
  --shadow: 0 2px 8px rgba(0,0,0,0.10);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.14);
  --radius: 8px;
  --correct: #2d7a2d;
  --wrong: #8b1a1a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Georgia', serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.65;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--forest);
  color: #fff;
  padding: 0 1.5rem;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 0 0.5rem;
}

.header-top h1 {
  font-size: 1.35rem;
  font-weight: normal;
  letter-spacing: 0.02em;
}

.header-top h1 small {
  display: block;
  font-size: 0.8rem;
  opacity: 0.7;
  font-family: sans-serif;
  letter-spacing: 0;
}

.mode-btn {
  margin-left: auto;
  background: var(--leaf);
  color: #fff;
  border: none;
  padding: 0.45rem 1.1rem;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.88rem;
  font-family: sans-serif;
  transition: background 0.2s;
  white-space: nowrap;
}

.mode-btn:hover { background: var(--leaf-light); }
.mode-btn.active { background: var(--bark); }

/* ── CATEGORY TABS ── */
.cat-tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-top: 1px solid rgba(255,255,255,0.15);
  margin-top: 0.5rem;
}
.cat-tabs::-webkit-scrollbar { display: none; }

.cat-tab {
  background: none;
  border: none;
  color: rgba(255,255,255,0.65);
  padding: 0.6rem 1rem;
  cursor: pointer;
  font-family: sans-serif;
  font-size: 0.82rem;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}

.cat-tab:hover { color: rgba(255,255,255,0.9); }

.cat-tab.active {
  color: #fff;
  border-bottom-color: var(--moss);
}

/* ── QUIZ CATEGORY FILTER ── */
.quiz-filter {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 1rem;
  font-family: sans-serif;
  font-size: 0.82rem;
  color: var(--muted);
}
.quiz-filter label { font-weight: bold; }
.quiz-filter select {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.3rem 0.5rem;
  background: white;
  font-size: 0.85rem;
  color: var(--ink);
}

/* ── MAIN LAYOUT ── */
main {
  max-width: 860px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

/* ── CATEGORY DESCRIPTION ── */
.cat-description {
  background: #fff;
  border: 1px solid var(--border);
  border-left: 4px solid var(--leaf);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow);
}

.cat-description h2 {
  font-size: 1.15rem;
  color: var(--forest);
  margin-bottom: 0.4rem;
}

.cat-description p {
  font-size: 0.92rem;
  color: var(--muted);
  font-family: sans-serif;
}

/* ── STUDY MODE: QUESTION LIST ── */
.questions-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.8rem;
}

.questions-header h3 {
  font-size: 1rem;
  color: var(--muted);
  font-weight: normal;
  font-family: sans-serif;
}

.expand-all-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.25rem 0.8rem;
  font-size: 0.8rem;
  cursor: pointer;
  color: var(--muted);
  font-family: sans-serif;
}
.expand-all-btn:hover { background: var(--border); }

.question-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 0.6rem;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.question-toggle {
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 0.85rem 1rem;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 0.7rem;
  font-family: 'Georgia', serif;
  font-size: 0.95rem;
  color: var(--ink);
  transition: background 0.15s;
}

.question-toggle:hover { background: #f5f2ea; }

.q-number {
  font-family: sans-serif;
  font-size: 0.75rem;
  color: var(--muted);
  min-width: 2em;
  margin-top: 0.15em;
}

.q-text { flex: 1; }

.q-chevron {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 0.15em;
  transition: transform 0.2s;
}

.question-item.open .q-chevron { transform: rotate(90deg); }

.answer-panel {
  display: none;
  padding: 0 1rem 1rem 2.9rem;
  font-size: 0.92rem;
}

.question-item.open .answer-panel { display: block; }

.answer-text {
  background: #f5f2ea;
  border-radius: 6px;
  padding: 0.75rem 1rem;
  white-space: pre-wrap;
  font-family: sans-serif;
  line-height: 1.6;
}

.ai-badge {
  display: inline-block;
  background: var(--ai-bg);
  color: var(--ai-color);
  border: 1px solid #aadaee;
  border-radius: 4px;
  font-size: 0.7rem;
  font-family: sans-serif;
  padding: 0.1em 0.5em;
  margin-bottom: 0.4rem;
  font-weight: bold;
}

.source-note {
  font-size: 0.75rem;
  color: var(--muted);
  font-family: sans-serif;
  margin-top: 0.4rem;
}

/* ── QUIZ MODE ── */
#quiz-mode { display: none; }
#quiz-mode.active { display: block; }
#study-mode.hidden { display: none; }

.quiz-progress {
  font-family: sans-serif;
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--leaf);
  border-radius: 3px;
  transition: width 0.3s;
}

.quiz-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 2rem 1.5rem 1.5rem;
  min-height: 260px;
  display: flex;
  flex-direction: column;
}

.quiz-cat-label {
  font-family: sans-serif;
  font-size: 0.75rem;
  color: var(--leaf);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.8rem;
  font-weight: bold;
}

.quiz-question {
  font-size: 1.15rem;
  flex: 1;
  margin-bottom: 1.2rem;
  line-height: 1.5;
}

.quiz-answer {
  background: #f0f7ea;
  border: 1px solid #b8d9a0;
  border-radius: 6px;
  padding: 1rem 1.1rem;
  font-family: sans-serif;
  font-size: 0.92rem;
  white-space: pre-wrap;
  line-height: 1.6;
  margin-bottom: 1rem;
  display: none;
}

.quiz-answer.visible { display: block; }

.quiz-ai-note {
  font-size: 0.75rem;
  color: var(--ai-color);
  font-style: italic;
  margin-top: 0.4rem;
}

.quiz-controls {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  border: none;
  border-radius: 6px;
  padding: 0.55rem 1.2rem;
  cursor: pointer;
  font-family: sans-serif;
  font-size: 0.88rem;
  transition: opacity 0.15s, background 0.15s;
}

.btn:disabled { opacity: 0.35; cursor: default; }

.btn-primary { background: var(--leaf); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--leaf-light); }

.btn-secondary { background: var(--border); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { background: #ccc8b8; }

.btn-outline {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
}
.btn-outline:hover:not(:disabled) { background: var(--border); }

.quiz-shuffle {
  margin-left: auto;
  font-size: 0.8rem;
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 3rem;
  color: var(--muted);
  font-family: sans-serif;
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .header-top h1 { font-size: 1.1rem; }
  .quiz-card { padding: 1.2rem 1rem 1rem; }
  .quiz-question { font-size: 1rem; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Bayerische Jägerprüfung
      <small>Lernhilfe – Mündliche Prüfung</small>
    </h1>
    <button class="mode-btn" id="mode-toggle-btn" onclick="toggleMode()">
      Quiz-Modus
    </button>
  </div>
  <nav class="cat-tabs" id="cat-tabs"></nav>
</header>

<main>
  <!-- STUDY MODE -->
  <div id="study-mode">
    <div class="cat-description" id="cat-desc"></div>
    <div class="questions-header">
      <h3 id="q-count-label"></h3>
      <button class="expand-all-btn" onclick="expandAll()">Alle aufklappen</button>
    </div>
    <div id="question-list"></div>
  </div>

  <!-- QUIZ MODE -->
  <div id="quiz-mode">
    <div class="quiz-filter">
      <label>Kategorie:</label>
      <select id="quiz-cat-select" onchange="initQuiz()">
        <option value="all">Alle Kategorien</option>
      </select>
    </div>
    <div class="quiz-progress">
      <span id="quiz-prog-label">Frage 1 von 1</span>
      <div class="progress-bar"><div class="progress-fill" id="quiz-prog-bar"></div></div>
    </div>
    <div class="quiz-card">
      <div class="quiz-cat-label" id="quiz-cat-label"></div>
      <div class="quiz-question" id="quiz-question">—</div>
      <div class="quiz-answer" id="quiz-answer">
        <span id="quiz-answer-text"></span>
        <div class="quiz-ai-note" id="quiz-ai-note" style="display:none">
          ⚠ Diese Antwort wurde durch KI ergänzt und sollte mit Fachliteratur verifiziert werden.
        </div>
      </div>
      <div class="quiz-controls">
        <button class="btn btn-primary" id="reveal-btn" onclick="revealAnswer()">Antwort anzeigen</button>
        <button class="btn btn-secondary" id="next-btn" onclick="nextQuestion()" style="display:none">Nächste Frage →</button>
        <button class="btn btn-outline" id="prev-btn" onclick="prevQuestion()" disabled>← Zurück</button>
        <button class="btn btn-outline quiz-shuffle" onclick="shuffleQuiz()">🔀 Mischen</button>
      </div>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════
//  EXAM DATA
// ═══════════════════════════════════════════════════
const EXAM_DATA = {
  categories: [
    // ───────────────────────────────────────────────
    {
      id: "waffen",
      number: 1,
      title: "Waffen und Waffenrecht",
      description: "Auf dem Prüfungstisch liegen typischerweise mehrere Waffen: Repetierer (z.B. Mauser 98 oder K98), Drilling, Bockflinte, Revolver und Pistole (z.B. Walther PPK), dazu verschiedene Patronen und oft ein Zielfernrohr. Der Prüfer fragt nach Identifikation und Zustandsbeschreibung der Waffen (Verschluss, Sicherung, Stecher, gespannt/entsichert/geladen), nach Munitionstypen und Gefährdungsbereichen sowie nach Grundlagen des Waffengesetzes (Kauf, Aufbewahrung, WBK).",
      questions: [
        {
          q: "Was ist eine Schusswaffe?",
          a: "Eine Schusswaffe ist eine Waffe, bei der Geschosse oder andere Stoffe durch einen Lauf getrieben werden. Der Antrieb kann mechanisch, chemisch oder physikalisch sein.",
          ai: false
        },
        {
          q: "Was ist eine Feuerwaffe?",
          a: "Eine Feuerwaffe ist eine Schusswaffe, bei der das Geschoss durch heiße Gase (Verbrennung von Treibladung) durch den Lauf getrieben wird. Beispiele: Büchse, Flinte, Pistole.",
          ai: false
        },
        {
          q: "Was sind kalte/blanke Waffen? Nenne drei Beispiele.",
          a: "Kalte Waffen sind Hieb-, Stich- und Stoßwaffen, die durch Muskelkraft angetrieben werden.\nBeispiele: Hirschfänger, Jagdnicker, Saufeder.\nSie werden zum Abfangen von gestelltem oder krankem Wild und zum Aufbrechen verwendet.",
          ai: false
        },
        {
          q: "Was sind Langwaffen und Kurzwaffen?",
          a: "Langwaffen (§ WaffG, Anlage 1): Schusswaffen mit einer Lauflänge über 30 cm ODER einer Gesamtlänge über 60 cm (z.B. Büchsen, Flinten, Drilling).\nKurzwaffen: alle anderen Schusswaffen, also Pistolen und Revolver.",
          ai: false
        },
        {
          q: "Was ist ein Drilling und woran erkennt man ihn?",
          a: "Ein Drilling ist eine kombinierte Jagdwaffe mit drei Läufen: zwei Schrotläufe nebeneinander (oben) und einem Büchsenlauf darunter (mittig). Erkennungsmerkmale: drei Läufe, Umschalter (meist auf dem Kolbenhals) zum Aktivieren des Büchsenabzugs, Kippverschluss (Kipplaufwaffe). Er ermöglicht sowohl Schrot- als auch Kugeljagd mit einer Waffe.",
          ai: false
        },
        {
          q: "Was sind Signalstifte und was zeigen sie an?",
          a: "Signalstifte zeigen den Lade- oder Spannzustand an:\n- Beim Drilling (Schlosshalter): Zeigen an, ob das jeweilige Schloss gespannt ist.\n- Bei der Walther PPK: Es ist ein Ladestift, der anzeigt, ob sich eine Patrone im Patronenlager befindet (er ragt dann hinten über dem Hahn heraus).",
          ai: false
        },
        {
          q: "Was ist ein Stecher? Welche Arten gibt es und wie steche ich ein/aus?",
          a: "Ein Stecher reduziert den Abzugswiderstand für einen präzisen Schuss. Es gibt zwei Hauptarten:\n1. Französischer Stecher (Rückstecher): Ein Abzug, der zum Einstechen nach vorne gedrückt wird.\n2. Deutscher Stecher (Doppelzüngelstecher): Zwei Abzüge; der hintere wird zum Einstechen nach hinten gezogen, der vordere dient zum Auslösen.\nEntstechen: In sicherer Richtung die Waffe sichern und bei Kipplaufwaffen durch Öffnen des Verschlusses (bricht die Stecherrastung). Bei Repetierern: Sichern und vorsichtiges manuelles Entspannen oder durch Öffnen der Kammer.",
          ai: false
        },
        {
          q: "Was ist der Unterschied zwischen Büchsenläufen und Flintenläufen?",
          a: "Büchsenläufe sind gezogen (haben Züge und Felder), die dem Geschoss einen Drall verleihen und damit die Präzision erhöhen.\nFlintenläufe sind glatt (keine Züge), geeignet für Schrot und Flintenlaufgeschosse.",
          ai: false
        },
        {
          q: "Was bedeutet die Kaliberangabe z.B. 7×65R oder 8×57IS?",
          a: "Die erste Zahl bezeichnet den Geschossdurchmesser in mm (z.B. 7 mm).\nDie zweite Zahl bezeichnet die Hülsenlänge in mm (z.B. 65 mm).\nBuchstaben hinter der Zahl: R = Rand (Hülse mit Rand für Kipplaufwaffen). Beim 8×57 unterscheidet I (Infanterie, Bohrung 7,9 mm) von IS (Infanterie-Spitz, Bohrung 8,2 mm) – nicht verwechseln, IS-Munition darf NICHT in I-Läufen verschossen werden.",
          ai: false
        },
        {
          q: "Was bedeutet das 'R' beim Kaliber (z.B. 7×65R)? Für welche Waffe wird es verwendet?",
          a: "Das 'R' steht für 'Rand' – die Hülse hat einen vorstehenden Rand am Boden. Dieser Rand dient als Anschlag im Patronenlager von Kipplaufwaffen (Drilling, Bockdoppelbüchse). Randlose Patronen werden in Repetierwaffen verwendet.",
          ai: false
        },
        {
          q: "Was ist der Unterschied zwischen Randpatrone, randloser Patrone und Patrone mit Rille?",
          a: "Randpatrone: hat vorstehenden Rand, für Kipplaufwaffen (Drilling).\nRandlose Patrone: für Repetierwaffen (z.B. Mauser 98, K98).\nPatrone mit Rille (Halbrand/Rillenpatrone): z.B. für Selbstladepistolen wie die Walther PPK – die Rille dient dem Auszieherhaken.",
          ai: false
        },
        {
          q: "Was ist eine Schrotpatrone? Welche Kaliber gibt es und wie groß ist der Gefährdungsbereich?",
          a: "Eine Schrotpatrone enthält viele kleine Schrotkugeln (traditionell Blei, zunehmend Weicheisen/Stahl). \nKaliber: z.B. 12/70. '12' bedeutet, dass aus einem englischen Pfund Blei (453,6g) 12 gleich große Kugeln vom Laufdurchmesser gegossen werden können. '70' ist die Länge der abgeschossenen Hülse in mm.\nGefährdungsbereich: Schrotstärke in mm × 100 = Meter (Faustformel). Beispiel: 3 mm Schrot → 300 m Gefahrenbereich.",
          ai: false
        },
        {
          q: "Was ist ein Flintenlaufgeschoss (FLG)? Wofür wird es eingesetzt und wie groß ist der Gefährdungsbereich?",
          a: "Ein FLG ist ein Einzelgeschoss für Flinten. Es hat Rillen, die das Verformen beim Durchqueren des Chokes ermöglichen. Wofür: Schalenwild bei Gesellschaftsjagden und als Fangschuss. Gefährdungsbereich: ca. 1.500 m.",
          ai: false
        },
        {
          q: "Wie groß ist der Gefährdungsbereich von Büchsenmunition?",
          a: "Büchsenmunition hat einen Gefährdungsbereich von bis zu 5.000 m. Daher ist ein sicherer Kugelfang vor jedem Schuss zwingend zu prüfen.",
          ai: false
        },
        {
          q: "Darf man aus einer Waffe ohne Lilienzeichen Stahlschrot verschießen?",
          a: "Bedingt ja. Aus Flinten mit normalem Beschuss (ohne Lilie) darf Weicheisenschrot (Stahlschrot) bis zu einer Korngröße von 3,25 mm verschossen werden, sofern die Mündungsgeschwindigkeit V2,5 unter 400 m/s liegt (Standardpatrone). Höchstleistungspatronen (über 3,25 mm oder V2,5 > 400 m/s) erfordern zwingend den Stahlschrotbeschuss (Lilie) und einen verstärkten Choke.",
          ai: false
        },
        {
          q: "Was ist der Choke und wozu dient er?",
          a: "Der Choke ist eine Verengung am Ende des Flintenlaufes (Mündung). Er beeinflusst den Streukreis der Schrotkörner: enger Choke = geringere Streuung (für weite Distanzen), weiter Choke = größere Streuung (für kurze Distanzen).",
          ai: false
        },
        {
          q: "Was sagt die Zielfernrohrbezeichnung z.B. 8×58 aus?",
          a: "8 = achtfache Vergrößerung.\n58 = Objektivdurchmesser in mm.\nDaraus ergibt sich die Austrittspupille: 58 ÷ 8 = 7,25 mm – je größer, desto besser bei schwachem Licht.",
          ai: false
        },
        {
          q: "Was ist die Austrittspupille und wie wird sie berechnet?",
          a: "Die Austrittspupille ist der Lichtkreis, der aus dem Okular des Zielfernrohrs austritt. Berechnung: Objektivdurchmesser ÷ Vergrößerung. Beispiel: 8×58 → 58 ÷ 8 = 7,25 mm. Eine größere Austrittspupille ermöglicht bessere Sicht bei Dämmerung.",
          ai: false
        },
        {
          q: "Was ist der Unterschied zwischen Absehen 1 und Absehen 4?",
          a: "Absehen 1: Besteht aus zwei horizontalen Balken und einem Zielstachel (Spitze in der Mitte). Gut für schnelle Zielerfassung, deckt aber nach oben wenig ab.\nAbsehen 4: Drei dicke Balken (links, rechts, unten) und ein feines Fadenkreuz in der Mitte. Die Balken führen das Auge ins Zentrum, das feine Kreuz ermöglicht präzises Schießen. Es ist das heute gebräuchlichste Jagdabsehen.",
          ai: false
        },
        {
          q: "Wie viele Patronen darf ich auf der Jagd ins Magazin laden?",
          a: "Bei halbautomatischen Langwaffen (Selbstladebüchsen, Selbstladeflinten) gilt: max. 2 Patronen im Magazin + 1 im Patronenlager = 3 insgesamt (§ 19 Abs. 1 Nr. 2 BJagdG). Bei Repetierbüchsen oder Kipplaufwaffen gibt es diese Begrenzung nicht – hier zählt nur die Magazinkapazität der Waffe.",
          ai: false
        },
        {
          q: "Was sind wesentliche Teile einer Waffe? (am Beispiel Walther PPK)",
          a: "Lauf, Verschluss (Schlitten), Magazin, Patronenlager, Abzug, Schlagbolzen/Hahn, Sicherung. Wesentliche Teile im Sinne des WaffG sind u.a. Lauf und Verschluss, da sie die Funktion der Waffe bestimmen.",
          ai: false
        },
        {
          q: "Was ist GEE (auf einer Munitionspackung)?",
          a: "GEE = Günstigste Einschieß-Entfernung (auch 'Optimale Einschieß-Entfernung'). Es ist die Entfernung (in Metern), auf die ein Gewehr eingeschossen werden sollte, damit das Geschoss innerhalb seiner praxisgerechten Schussdistanz nie mehr als ca. 4 cm über oder unter der Visierlinie verläuft (Halten 'Fleck' im Hauptzielbereich). Wert hängt von Kaliber/Laborierung ab und steht meist auf der Munitionspackung.",
          ai: false
        },
        {
          q: "Wie sind Waffen zuhause aufzubewahren? Was gilt für Schlüssel?",
          a: "In einem Waffenschrank (Widerstandsgrad 0 oder 1 nach DIN/EN 1143-1).\nSchlüsselaufbewahrung (Urteil 2023): Schlüssel müssen in einem Behältnis aufbewahrt werden, das dem Sicherheitsstandard der darin verwahrten Waffen entspricht (also ebenfalls Grad 0/1). Ein einfaches Verstecken oder ein minderwertiger Tresor für den Schlüssel ist unzulässig.",
          ai: false

// ═══════════════════════════════════════════════════
//  APP STATE
// ═══════════════════════════════════════════════════
let currentCatIdx = 0;
let isQuizMode = false;

// Quiz state
let quizQuestions = [];
let quizIdx = 0;
let quizAnswerShown = false;

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
function init() {
  buildCatTabs();
  buildQuizCatSelect();
  renderStudyMode(0);
}

function buildCatTabs() {
  const nav = document.getElementById('cat-tabs');
  EXAM_DATA.categories.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (i === 0 ? ' active' : '');
    btn.textContent = cat.title;
    btn.onclick = () => selectCategory(i);
    nav.appendChild(btn);
  });
}

function buildQuizCatSelect() {
  const sel = document.getElementById('quiz-cat-select');
  EXAM_DATA.categories.forEach((cat, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = cat.title;
    sel.appendChild(opt);
  });
}

// ═══════════════════════════════════════════════════
//  STUDY MODE
// ═══════════════════════════════════════════════════
function selectCategory(idx) {
  currentCatIdx = idx;
  document.querySelectorAll('.cat-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  if (!isQuizMode) renderStudyMode(idx);
}

function renderStudyMode(idx) {
  const cat = EXAM_DATA.categories[idx];
  document.getElementById('cat-desc').innerHTML =
    `<h2>${cat.number}. ${cat.title}</h2><p>${cat.description}</p>`;

  document.getElementById('q-count-label').textContent =
    `${cat.questions.length} Fragen`;

  const list = document.getElementById('question-list');
  list.innerHTML = '';
  cat.questions.forEach((q, i) => {
    const item = document.createElement('div');
    item.className = 'question-item';
    item.innerHTML = `
      <button class="question-toggle" onclick="toggleQ(this)">
        <span class="q-number">${i + 1}.</span>
        <span class="q-text">${escHtml(q.q)}</span>
        <span class="q-chevron">▶</span>
      </button>
      <div class="answer-panel">
        ${q.ai ? '<span class="ai-badge">KI-Antwort</span>' : ''}
        <div class="answer-text">${escHtml(q.a)}</div>
        ${q.ai ? '<div class="source-note">⚠ Diese Antwort wurde durch KI ergänzt. Bitte mit Fachliteratur (z.B. Heintges) verifizieren.</div>' : ''}
      </div>`;
    list.appendChild(item);
  });
}

function toggleQ(btn) {
  const item = btn.closest('.question-item');
  item.classList.toggle('open');
}

function expandAll() {
  const open = document.querySelectorAll('.question-item.open').length;
  const all = document.querySelectorAll('.question-item');
  if (open < all.length) {
    all.forEach(i => i.classList.add('open'));
  } else {
    all.forEach(i => i.classList.remove('open'));
  }
}

// ═══════════════════════════════════════════════════
//  QUIZ MODE
// ═══════════════════════════════════════════════════
function toggleMode() {
  isQuizMode = !isQuizMode;
  const btn = document.getElementById('mode-toggle-btn');
  const study = document.getElementById('study-mode');
  const quiz = document.getElementById('quiz-mode');

  btn.textContent = isQuizMode ? 'Lernmodus' : 'Quiz-Modus';
  btn.classList.toggle('active', isQuizMode);
  study.classList.toggle('hidden', isQuizMode);
  quiz.classList.toggle('active', isQuizMode);

  if (isQuizMode) initQuiz();
}

function initQuiz() {
  const sel = document.getElementById('quiz-cat-select');
  const val = sel.value;
  if (val === 'all') {
    quizQuestions = [];
    EXAM_DATA.categories.forEach(cat => {
      cat.questions.forEach(q => quizQuestions.push({ ...q, catTitle: cat.title }));
    });
  } else {
    const cat = EXAM_DATA.categories[parseInt(val)];
    quizQuestions = cat.questions.map(q => ({ ...q, catTitle: cat.title }));
  }
  quizIdx = 0;
  showQuizQuestion();
}

function shuffleQuiz() {
  for (let i = quizQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQuestions[i], quizQuestions[j]] = [quizQuestions[j], quizQuestions[i]];
  }
  quizIdx = 0;
  showQuizQuestion();
}

function showQuizQuestion() {
  if (!quizQuestions.length) return;
  quizAnswerShown = false;
  const q = quizQuestions[quizIdx];

  document.getElementById('quiz-cat-label').textContent = q.catTitle;
  document.getElementById('quiz-question').textContent = q.q;
  document.getElementById('quiz-answer-text').textContent = q.a;
  document.getElementById('quiz-ai-note').style.display = q.ai ? 'block' : 'none';

  const answerDiv = document.getElementById('quiz-answer');
  answerDiv.classList.remove('visible');

  document.getElementById('reveal-btn').style.display = '';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('prev-btn').disabled = quizIdx === 0;

  const total = quizQuestions.length;
  document.getElementById('quiz-prog-label').textContent =
    `Frage ${quizIdx + 1} von ${total}`;
  document.getElementById('quiz-prog-bar').style.width =
    `${((quizIdx + 1) / total) * 100}%`;
}

function revealAnswer() {
  document.getElementById('quiz-answer').classList.add('visible');
  document.getElementById('reveal-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = '';
}

function nextQuestion() {
  if (quizIdx < quizQuestions.length - 1) {
    quizIdx++;
    showQuizQuestion();
  }
}

function prevQuestion() {
  if (quizIdx > 0) {
    quizIdx--;
    showQuizQuestion();
  }
}

// ═══════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════
function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

init();
</script>
</body>
</html>
